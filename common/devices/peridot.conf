# Xiaomi POCO F6 / Redmi Turbo 3 -- Qualcomm SM8635 (Snapdragon 8s Gen 3).
NAME="POCO F6 / Redmi Turbo 3 (peridot)"
KIND=phone
SOC="Qualcomm Snapdragon 8s Gen 3 (SM8635)"

UEFI_TARGET=peridot
UEFI_FD=
DTB=uefi/files/Resources/DTBs/peridot.dtb
FD_BASE=0xA7100000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

FB_BASE=0xE3940000              # 1220 x 2712; xnuloader picks platform_peridot by it
WIFI_ATH11K=1                   # WCN6750/ath11k path; radio stays off unless wifi=1 is passed at boot
WIFI_BDF=n16t                   # Peridot's QCA6750 board data from its modem firmware image
BOARD_ARGS="board_epss=0x17d91000 board_small_cores=0x07 board_prime_core=7 board_cmd_db=0x81c60000 board_rsc=0x17a20000 board_tsens0=0xc222000 board_tsens1=0xc223000 board_tsens2=0xc224000 board_smem=0x81d00000 board_aoss=0xc300000 board_ipcc=0x406000 board_tlmm=0xf100000 board_wpss_mem=0x9bb00000 board_wpss_size=0x1900000 board_wifi_iova=0xb0000000 board_wifi_msi=0x17110040 board_wifi_stream=0x1400 board_wifi_bdf=n16t board_wifi_rail_cx=smpb3 board_wifi_rail_xo=smpb1 board_wifi_rail_rfa=smpb2 board_wifi_pmic1=PMXR2230 board_wifi_pmic2=PM8550VS board_gpu_chip=0x43030b00 board_wlan_reset=35 board_bt_sw=80 board_bt_reset=156 board_gcc=0x100000 board_dispcc=0xaf00000 board_intf=0xae36000 board_ufshc=0x1d84000 board_spmi_core=0xc400000 board_spmi_cnfg=0xc42d000 board_spmi_obsrvr=0xc440000"
# Modem/IPA addresses from peridot.dts: mpss@8bc00000 (0xcd00000), ipa@3e00000,
# apps-smmu@15000000, ipa_gsi@98990000, and the unused CDSP memory for RMTFS.
BOARD_ARGS="$BOARD_ARGS soc_aoss=0xc300000 soc_ipcc=0x406000 soc_rsc=0x17a20000 soc_smem_lock=0x1f43000"
BOARD_ARGS="$BOARD_ARGS soc_ipa_base=0x3e40000 soc_gsi_base=0x3e04000 soc_ipa_regs=0x3e40000 soc_ipa_sram=0x3e50000 soc_gsi_ee0=0x3e16000"
BOARD_ARGS="$BOARD_ARGS soc_apps_smmu=0x15000000 soc_smem=0x81d00000 soc_cmd_db=0x81c60000 soc_imem=0x14600000"
BOARD_ARGS="$BOARD_ARGS soc_mpss_mem=0x8bc00000 soc_mpss_size=0xcd00000 soc_ipa_stream=0x4a0 soc_ipa_stream_uc=0x4a2"
BOARD_ARGS="$BOARD_ARGS soc_pas_mpss=4 soc_pas_ipa=15 soc_ipa_fw=ipa_fws modem_ipa_fw_at=0x98990000 modem_buffer=0x99900000"

# bootcpu=7: run on the Cortex-X4; the loader stays on core 0 (Cortex-A520).
# modem=1 starts MPSS/SIM/NAS; pull fw-modem/ from the phone first.
BOOTARGS="touchscreen=1 cpus=8 gpu=1 adreno_stream1=0 metal=1 thermal=2 modem=1 bt=1"
DEFAULT_SECS=900
USERLAND_VARS="GL=1"
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic fw-modem fw-bt"
