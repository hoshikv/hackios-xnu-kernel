# Xiaomi POCO F6 / Redmi Turbo 3 -- Qualcomm SM8635 (Snapdragon 8s Gen 3).
NAME="POCO F6 / Redmi Turbo 3 (peridot)"
KIND=phone
SOC="Qualcomm Snapdragon 8s Gen 3 (SM8635)"

UEFI_TARGET=peridot
UEFI_FD=
DTB=uefi/files/Resources/DTBs/peridot.dtb
FD_BASE=0xA7100000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

FB_BASE=0xE3940000              # 1220 x 2712; xnuloader picks platform_peridot by it
WIFI_ATH11K=0                   # Peridot DT advertises qcom,wcn6750; leave the ath11k path off until radio bring-up is mapped
BOARD_ARGS="board_epss=0x17d91000 board_cmd_db=0x81c60000 board_rsc=0x17a00000 board_tsens0=0xc222000 board_tsens1=0xc223000 board_tsens2=0xc224000 board_smem=0x81d00000 board_aoss=0xc300000 board_ipcc=0x406000 board_tlmm=0xf100000 board_wpss_mem=0x9bb00000 board_wpss_size=0x1900000 board_wifi_iova=0xb0000000 board_wifi_msi=0x17110040 board_wlan_reset=35 board_bt_sw=80 board_bt_reset=156 board_gcc=0x100000 board_dispcc=0xaf00000 board_intf=0xae36000 board_ufshc=0x1d84000 board_spmi_core=0xc400000 board_spmi_cnfg=0xc42d000 board_spmi_obsrvr=0xc440000"

# bootcpu=7: run on the Cortex-X4; the loader stays on core 0 (Cortex-A520).
BOOTARGS="touchscreen=1 cpus=8 gpu=1 adreno_stream1=0 metal=1 thermal=2"
DEFAULT_SECS=900
USERLAND_VARS="GL=1"
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
