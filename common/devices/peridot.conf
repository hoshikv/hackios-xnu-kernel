# Xiaomi POCO F6 / Redmi Turbo 3 -- Qualcomm SM8635 (Snapdragon 8s Gen 3).
NAME="POCO F6 / Redmi Turbo 3 (peridot)"
KIND=phone
SOC="Qualcomm Snapdragon 8s Gen 3 (SM8635)"

UEFI_TARGET=peridot
UEFI_FD=
DTB=uefi/files/Resources/DTBs/peridot.dtb
FD_BASE=0xA7100000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

FB_BASE=0xE3940000              # 1220 x 2712; xnuloader picks platform_peridot by it
WIFI_ATH11K=0                   # WCN7850 (FastConnect 7800) is not ath11k; left off for bring-up

# bootcpu=7: run on the Cortex-X4; the loader stays on core 0 (Cortex-A520).
BOOTARGS="touchscreen=1 cpufreq=1 bootcpu=7 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
