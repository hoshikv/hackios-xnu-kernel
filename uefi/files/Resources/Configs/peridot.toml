#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true
xnu_kernel         = "Resources/Xnu/kernel.bin"
xnu_devicetree     = "Resources/Xnu/sm8635.dt"
# xnu_ramdisk      = "Resources/Xnu/root.img"

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
